apiVersion: v1
kind: Namespace
metadata:
  name: mcp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-demo
  labels: {app.kubernetes.io/name: mcp-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-demo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: docker.io/library/python@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python3", "/app/server.py"]
          env:
            - {name: MANIFEST, value: /app/mcp-manifest.json}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: mcp, containerPort: 8811}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: mcp-demo-code}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-demo
  labels: {app.kubernetes.io/name: mcp-demo}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: mcp-demo}
  ports:
    - {name: mcp, port: 8811, targetPort: mcp, protocol: TCP}
