{{- /* mcp-manifest.json is the one switch: "server": {"scheme": "https"} → the server runs with --tls */}}
{{- $manifest := .Files.Get "mcp-manifest.json" | fromJson }}
{{- $tls := eq (default "http" (($manifest).server).scheme) "https" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-demo-code
  labels: {app.kubernetes.io/name: mcp-demo}
data:
  server.py: |-
{{ .Files.Get "server.py" | indent 4 }}
  mcp-manifest.json: |-
{{ .Files.Get "mcp-manifest.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-demo
  labels: {app.kubernetes.io/name: mcp-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-demo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-demo}
      annotations:
        checksum/code: {{ print (.Files.Get "server.py") (.Files.Get "mcp-manifest.json") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          # Python + the `cryptography` library (to check the platform's signature) in one maintained public image
          image: docker.io/certbot/certbot@sha256:9626d72120577cf72da4fc7948806e9993598981720a4cbe04340a502468d67b  # v4.2.0
          command: ["python3", "/app/server.py"{{ if $tls }}, "--tls"{{ end }}]
          env:
            - {name: MANIFEST, value: /app/mcp-manifest.json}
            # MCP contract v2: the token's audience is this namespace, read here, never a name typed by an admin
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: SERVICE_NAME, value: mcp-demo}
            - {name: PLATFORM_KEY, value: {{ .Values.platformKey | quote }}}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: mcp, containerPort: 8811}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp{{ if $tls }}, scheme: HTTPS{{ end }}}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            {{- if $tls }}
            # the certificate is made at start; its key is written encrypted for an instant (ssl loads from files)
            - {name: tmp, mountPath: /tmp}
            {{- end }}
      volumes:
        - name: code
          configMap: {name: mcp-demo-code}
        {{- if $tls }}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-demo
  labels: {app.kubernetes.io/name: mcp-demo}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: mcp-demo}
  ports:
    - {name: mcp, port: 8811, targetPort: mcp, protocol: TCP}
